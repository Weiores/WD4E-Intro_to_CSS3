  <!-- HERO -->
  <header class="page-hero">
    <h1>Spotting <em>Gallery</em></h1>
    <p>Collections of avian moments across Singapore, ranging from common backyard sightings to rare encounters.</p>
  </header>

  <!-- MAIN — Flex gallery-->
  <main id="main-content" class="wrapper">
    <h2 class="section-title">Snapshots</h2>

    <!-- Flex container: gallery-flex class -->
    <div class="gallery-flex" role="list" aria-label="Travel photo gallery">

      <!-- Photo 1 (odd) -->
      <figure class="gallery-item" role="listitem">
        <img
          class="styled"
          src="https://singaporebirds.com/wp-content/uploads/2016/01/little-grebe-fy1x9258-103eos1d-121124-768x512.jpg"
          alt="Little grebe on a calm lake in Singapore"
          width="600"
          height="450"
        />
        <figcaption>Little Grebe at Macritchie Reservoir</figcaption>
      </figure>

      <!-- Photo 2 -->
      <figure class="gallery-item" role="listitem">
        <img
          class="styled"
          src="https://singaporebirds.com/wp-content/uploads/2018/07/red-junglefowl-bishan-park-adrian-silas-tay-768x512.jpg"
          alt="Red junglefowl in Bishan Park, Singapore"
          width="600"
          height="450"
        />
        <figcaption>Red Junglefowl at Bishan Park</figcaption>
      </figure>

      <!-- Photo 3-->
      <figure class="gallery-item" role="listitem">
        <img
          class="styled"
          src="https://singaporebirds.com/wp-content/uploads/2017/01/jacobin-cuckoo-zacc-1-768x614.jpg"
          alt="Jacobin cuckoo in a forested area of Singapore"
          width="600"
          height="450"
        />
        <figcaption>Jacobin Cuckoo at Bukit Batok Nature Park</figcaption>
      </figure>

      <!-- Photo 4 -->
      <figure class="gallery-item" role="listitem">
        <img
          class="styled"
          src="https://singaporebirds.com/wp-content/uploads/2016/01/banded-bay-cuckoo-140115-112eos1d-fy1x9213-768x512.jpg"
          alt="Banded bay cuckoo in a forested area of Singapore"
          width="600"
          height="450"
        />
        <figcaption>Banded Bay Cuckoo at Macritchie Reservoir</figcaption>
      </figure>

      <!-- Photo 5 -->
      <figure class="gallery-item" role="listitem">
        <img
          class="styled"
          src="https://singaporebirds.com/wp-content/uploads/2021/07/indian-cuckoo-180103-115eos1d-f1x28258-n-768x512.jpg"
          alt="Indian cuckoo perched on a branch in Singapore"
          width="600"
          height="450"
        />
        <figcaption>Indian Cuckoo at Labrador Nature Reserve</figcaption>
      </figure>

      <!-- Photo 6 -->
      <figure class="gallery-item" role="listitem">
        <img
          class="styled"
          src="https://singaporebirds.com/wp-content/uploads/2021/12/Ashy-HeadedGreenPigeon_JenWei3-768x512.jpg"
          alt="Ashy-headed green pigeon in a forested area of Singapore"
          width="600"
          height="450"
        />
        <figcaption>Ashy-Headed Green Pigeon at Macritchie Reservoir</figcaption>
      </figure>

    </div><!-- /.gallery-flex -->
  </main>
